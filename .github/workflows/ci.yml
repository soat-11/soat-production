name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

jobs:
  validate-code:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Build
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov
        env:
          PORT: 3001
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/production_db_test
          CART_SERVICE_URL: http://localhost:3000
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          SQS_PAYMENT_CONFIRMED_URL: https://sqs.fake/payment-confirmed
          SQS_PRODUCTION_STARTED_URL: https://sqs.fake/production-started
          SQS_PRODUCTION_READY_URL: https://sqs.fake/production-ready
          SQS_PRODUCTION_WITHDRAWN_URL: https://sqs.fake/production-withdrawn

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [validate-code, test, sonarqube]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/production:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name soat-challenge-eks-cluster --region us-east-1

      - name: Deploy to EKS
        run: |
          # 1. Define a imagem nova com a tag SHA (garante imutabilidade)
          kubectl set image deployment/production-deployment production=${{ steps.login-ecr.outputs.registry }}/production:${{ github.sha }}

          # 2. Aguarda o rollout terminar para dar sucesso ou falha
          kubectl rollout status deployment/production-deployment
